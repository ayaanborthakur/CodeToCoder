<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Removed coi-serviceworker to fix Auth redirects -->
    <!-- Added Pyodide for Main Thread execution -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    <script src="/env-config.js"></script>
    <title>CodeToCoder: Learn Python with AI</title>

    <!-- Google Fonts: JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

    <!-- PrismJS for Syntax Highlighting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>

    <link rel="stylesheet" href="./index.css" />
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
          "react-dom": "https://esm.sh/react-dom@18.3.1",
          "@google/genai": "https://esm.sh/@google/genai"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/input-serviceworker.js')
            .then(reg => console.log('Input Service Worker Registered', reg.scope))
            .catch(err => console.error('Service Worker Registration Failed', err));
          
          // Listen for messages from the service worker (for input requests)
          navigator.serviceWorker.addEventListener('message', (event) => {
             // We dispatch a custom event so pyodideService can listen to it
             if (event.data && event.data.type === 'PYODIDE_INPUT_REQUEST') {
                 window.dispatchEvent(new CustomEvent('pyodide-input-request', { detail: event.data }));
             }
          });
        });
      }
    </script>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
