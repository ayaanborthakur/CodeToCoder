  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/input-serviceworker.js")
            .then((reg) =>
              console.log("Input Service Worker Registered", reg.scope)
            )
            .catch((err) =>
              console.error("Service Worker Registration Failed", err)
            );

          // Listen for messages from the service worker (for input requests)
          navigator.serviceWorker.addEventListener("message", (event) => {
            // We dispatch a custom event so pyodideService can listen to it
            if (event.data && event.data.type === "PYODIDE_INPUT_REQUEST") {
              window.dispatchEvent(
                new CustomEvent("pyodide-input-request", { detail: event.data })
              );
            }
          });
        });
      }
    </script>
    <script type="module" src="./index.tsx"></script>
